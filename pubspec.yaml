name: ah_transport_gujranwala
description: "AH Transport Gujranwala - Fleet, Trip & Accounts Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.1

  # Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Local storage
  shared_preferences: ^2.2.2

  # PDF generation / sharing
  pdf: ^3.10.7
  printing: ^5.11.1
  path_provider: ^2.1.1
  share_plus: ^7.2.1

  # Charts
  fl_chart: ^0.66.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Utilities
  image_picker: ^1.0.4
  local_auth: ^2.1.7
  uuid: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
