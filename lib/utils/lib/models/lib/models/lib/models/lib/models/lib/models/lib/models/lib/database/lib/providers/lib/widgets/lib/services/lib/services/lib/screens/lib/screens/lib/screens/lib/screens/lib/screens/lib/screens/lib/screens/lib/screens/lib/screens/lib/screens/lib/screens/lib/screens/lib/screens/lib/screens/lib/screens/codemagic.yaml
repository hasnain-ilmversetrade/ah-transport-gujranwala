workflows:
  android-workflow:
    name: AH Transport Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate Android platform files
        script: flutter create . --platforms=android
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
